servers:
  - url: /omg.org/spec/API4KP/20230201/api/repository/asset

tags:
  - name: Knowledge Asset Catalog
    description: >
      A Knowledge Asset Catalog is an indexed collection of Knowledge Assets.
      A Catalog identifies, versions, types/categorizes, and relates Assets to
      each other.
  - name: Knowledge Asset Repository
    description: >
      A Semantic Knowledge Repository provides access to Knowledge Artifacts
      based on their Asset content and representation thereof.
  - name: Knowledge Asset Retrieval
    description: >
      A Knowledge Asset Retrieval facility offers query/search engines that
      treat the content of the Knowledge Asset Catalog itself as a Knowledge
      Base.

paths:
  #############################
  # Catalog
  #############################
  /cat:
    get:
      tags: [Knowledge Asset Catalog]
      summary: Describe Knowledge Asset Catalog.
      description: >
        Returns a Knowledge Asset Catalog Resource that summarizes the
        capabilities of the Asset Repository. Dynamic information, such as the
        number of stored Assets, can be obtained querying the Knowledge Graph.
      operationId: getKnowledgeAssetCatalog
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeAssetCatalog'
            application/xml:
              schema:
                $ref: '#/components/schemas/KnowledgeAssetCatalog'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /cat/graph:
    get:
      tags: [Knowledge Asset Catalog]
      summary: Get Knowledge Graph
      description: >
        Returns a copy of the graph that indexes the known Assets, Artifacts,
        their relationships, and semantic annotations, reflecting the state of
        the Repository at the moment the call is made. The native
        representation of the Graph (e.g. RDF) is server specific, but can be
        negotiated.
      operationId: getKnowledgeGraph
      parameters:
        - $ref: '#/components/parameters/extAccept'
      responses:
        '200':
          description: >
            A Knowledge Carrier that wraps the Knowledge Graph, as a Knowledge
            Artifact, with representation metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeCarrier'
            application/xml:
              schema:
                $ref: '#/components/schemas/KnowledgeCarrier'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Knowledge Asset Catalog]
      summary: Query Knowledge Graph
      description: >
        Allows the client to submit a query to the Knowledge Asset Graph using
        a query language supported by the server (e.g. GraphQL, SPARQL).
      operationId: queryKnowledgeAssetGraph
      requestBody:
        $ref: '#/components/requestBodies/graphQuery'
      responses:
        '200':
          description: >
            The query was executed successfully. Does not imply that any
            result will be returned.
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/QueryResults'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
        '501':
          $ref: '#/components/responses/NotImplemented'

  #############################
  # Assets (Series)
  #############################
  /cat/assets:
    get:
      tags: [Knowledge Asset Catalog]
      summary: List Knowledge Assets.
      description: >
        Returns a collection of Pointers to the Assets managed under this
        Catalog, i.e. such that a Canonical Knowledge Asset Surrogate has been
        registered. The collection will be empty if the repository is empty,
        or if only empty Knowledge Asset series have been created. Basic
        filtering is allowed on asset type and annotations. The collection
        should also not include any Asset that the client does not have the
        permissions to access (i.e. getKnowledgeAsset would fail with a 403
        status code). If the client has access to the repository, but does not
        have access to any of the assets currently contained, the returned
        collection will be empty. Pagination parameters are optionally
        supported.
      operationId: listKnowledgeAssets
      parameters:
        - $ref: '#/components/parameters/assetTypeTag'
        - $ref: '#/components/parameters/assetAnnotationTag'
        - $ref: '#/components/parameters/assetAnnotationConcept'
        - $ref: '#/components/parameters/offset'
        - $ref: '#/components/parameters/limit'
      responses:
        '200':
          description: Returns a list of Pointers to Assets that the client has access to.
          headers:
            X-Total-Count:
              $ref: '#/components/headers/X-Total-Count'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Pointer'
            application/xml:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Pointer'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Knowledge Asset Catalog]
      summary: Create a new Knowledge Asset.
      description: >
        Creates a new empty Knowledge Asset (Series), assigning an asset ID in
        the process.
      operationId: initKnowledgeAsset
      responses:
        '201':
          description: Success
          headers:
            Content-Location:
              description: URL where the new Knowledge Asset Series can be accessed
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                type: string
                format: uuid
                description: The identifier of the newly created Knowledge Asset.
        '403':
          $ref: '#/components/responses/Forbidden'
        '405':
          $ref: '#/components/responses/ReadOnly'
        '500':
          $ref: '#/components/responses/InternalError'
        '501':
          $ref: '#/components/responses/NotImplemented'

  /cat/assets/{assetId}:
    parameters:
      - $ref: '#/components/parameters/assetId'
    get:
      tags: [Knowledge Asset Catalog]
      summary: Retrieve a Knowledge Asset.
      description: >
        Retrieves the LATEST version of a Knowledge Asset. In particular, the
        server SHALL return the LATEST version of the Canonical Surrogate for
        the LATEST version of the Asset. Content negotiation SHALL be only
        supported for text/html variants of the Surrogate. Support for more
        general forms of Surrogates, and negotiation thereof, is provided by
        getKnowledgeAssetSurrogate and its related operations.
      operationId: getKnowledgeAsset
      parameters:
        - $ref: '#/components/parameters/extAccept'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeAsset'
            application/xml:
              schema:
                $ref: '#/components/schemas/KnowledgeAsset'
            text/html:
              schema:
                $ref: '#/components/schemas/KnowledgeAsset'
        '303':
          description: >
            Redirects the client to a URL where the Canonical Surrogate, or
            its HTML variant, can be retrieved.
          headers:
            Location:
              schema:
                type: string
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '500':
          $ref: '#/components/responses/InternalError'
        '501':
          $ref: '#/components/responses/NotImplemented'

  /cat/assets/{assetId}/versions:
    parameters:
      - $ref: '#/components/parameters/assetId'
    get:
      tags: [Knowledge Asset Catalog]
      summary: Get all versions of a Knowledge Asset Surrogate.
      description: >
        Returns a list of all the available versions of a Knowledge Asset
        that a user is allowed to access. An Asset Series may be empty if no
        versions have been established. For each Asset version, returns a
        pointer to the LATEST Canonical Surrogate for that Asset version.
      operationId: listKnowledgeAssetVersions
      parameters:
        - $ref: '#/components/parameters/offset'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/beforeTag'
        - $ref: '#/components/parameters/afterTag'
        - $ref: '#/components/parameters/sort'
      responses:
        '200':
          description: Success
          headers:
            X-Total-Count:
              $ref: '#/components/headers/X-Total-Count'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Pointer'
            application/xml:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Pointer'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /cat/assets/{assetId}/versions/{versionTag}:
    parameters:
      - $ref: '#/components/parameters/assetId'
      - $ref: '#/components/parameters/versionTag'
    get:
      tags: [Knowledge Asset Catalog]
      summary: Retrieves a specific version of a Knowledge Asset.
      description: >
        Retrieves the LATEST version of the Canonical Surrogate that
        describes the given version of a Knowledge Asset.
      operationId: getKnowledgeAssetVersion
      parameters:
        - $ref: '#/components/parameters/extAccept'
      responses:
        '200':
          description: The Asset Version has been located and retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeAsset'
            application/xml:
              schema:
                $ref: '#/components/schemas/KnowledgeAsset'
            text/html:
              schema:
                $ref: '#/components/schemas/KnowledgeAsset'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags: [Knowledge Asset Catalog]
      summary: Set/Initialize a specific version of a Knowledge Asset.
      description: >
        Populates/updates the Canonical Surrogate for the given version of a
        Knowledge Asset. The client MUST provide a valid Surrogate whose
        declared Asset ID and version tag MUST match the `{assetId}` and
        `{versionTag}` parameters, and which MUST have an explicit version
        tag. The server SHALL validate the Surrogate for syntactic and
        semantic correctness and consistency. If an Asset version with the
        given ID does not exist, it will be created in the process, otherwise
        it will be updated.
      operationId: setKnowledgeAssetVersion
      requestBody:
        $ref: '#/components/requestBodies/assetSurrogate'
      responses:
        '204':
          description: >
            The given Surrogate has been set to provide metadata for a
            specific version of the given Knowledge Asset.
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: >
            The information contained in the Surrogate is
            invalid/inconsistent (including not matching the
            `{assetId}`/`{versionTag}`), or is incompatible with the
            Artifacts associated to the Asset.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          $ref: '#/components/responses/InternalError'
        '501':
          $ref: '#/components/responses/NotImplemented'

  #############################
  # Canonical Carrier (best match via content negotiation)
  #############################
  /cat/assets/{assetId}/carrier:
    parameters:
      - $ref: '#/components/parameters/assetId'
    get:
      tags: [Knowledge Asset Repository]
      summary: Retrieve the best Knowledge Carrier for the LATEST version of a given Knowledge Asset.
      description: >
        Retrieves a Knowledge Artifact that is a Carrier of the given Asset,
        selecting between the variants using server-driven Content
        Negotiation: retrieves the LATEST version of the Knowledge Asset,
        retrieves the LATEST Canonical surrogate for that version, consults
        the representation metadata for each associated Carrier, selects the
        one that matches the preferences of the client, and
        returns/redirects the client to a copy of the (LATEST version of the)
        chosen Artifact itself.
      operationId: getKnowledgeAssetCanonicalCarrier
      parameters:
        - $ref: '#/components/parameters/extAccept'
      responses:
        '200':
          description: A suitable Knowledge Artifact could be retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeCarrier'
            application/xml:
              schema:
                $ref: '#/components/schemas/KnowledgeCarrier'
            text/html:
              schema:
                $ref: '#/components/schemas/KnowledgeCarrier'
        '300':
          description: Negotiation failed, but suitable alternatives are present.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Pointer'
            application/xml:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Pointer'
            text/html:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Pointer'
        '303':
          description: Redirects the client to a URL where the chosen Artifact can be retrieved.
          headers:
            Location:
              schema:
                type: string
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '500':
          $ref: '#/components/responses/InternalError'
        '501':
          $ref: '#/components/responses/NotImplemented'

  /cat/assets/{assetId}/carrier/content:
    parameters:
      - $ref: '#/components/parameters/assetId'
    get:
      tags: [Knowledge Asset Repository]
      summary: Retrieve the raw content of the best Knowledge Carrier for the LATEST version of a given Knowledge Asset.
      description: >
        Same selection logic as `getKnowledgeAssetCanonicalCarrier`, but
        returns the raw content of the chosen Artifact directly, instead of
        wrapping it in a Knowledge Carrier envelope.
      operationId: getKnowledgeAssetCanonicalCarrierContent
      parameters:
        - $ref: '#/components/parameters/extAccept'
      responses:
        '200':
          description: Success
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '300':
          description: Negotiation failed, but suitable alternatives are present.
          content:
            application/octet-stream:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Pointer'
        '303':
          description: Redirects the client to a URL where the chosen Artifact can be retrieved.
          headers:
            Location:
              schema:
                type: string
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '500':
          $ref: '#/components/responses/InternalError'
        '501':
          $ref: '#/components/responses/NotImplemented'

  /cat/assets/{assetId}/versions/{versionTag}/carrier:
    parameters:
      - $ref: '#/components/parameters/assetId'
      - $ref: '#/components/parameters/versionTag'
    get:
      tags: [Knowledge Asset Repository]
      summary: Retrieve the best Knowledge Carrier for a given version of a Knowledge Asset.
      description: >
        Retrieves a Knowledge Artifact that is a Carrier of the given Asset
        version, selecting between the variants using server-driven Content
        Negotiation.
      operationId: getKnowledgeAssetVersionCanonicalCarrier
      parameters:
        - $ref: '#/components/parameters/extAccept'
      responses:
        '200':
          description: A suitable Knowledge Artifact could be retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeCarrier'
            application/xml:
              schema:
                $ref: '#/components/schemas/KnowledgeCarrier'
            text/html:
              schema:
                $ref: '#/components/schemas/KnowledgeCarrier'
        '300':
          description: Negotiation failed, but suitable alternatives are present.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Pointer'
            application/xml:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Pointer'
        '303':
          description: Redirects the client to a URL where the chosen Artifact can be retrieved.
          headers:
            Location:
              schema:
                type: string
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '500':
          $ref: '#/components/responses/InternalError'
        '501':
          $ref: '#/components/responses/NotImplemented'

  /cat/assets/{assetId}/versions/{versionTag}/carrier/content:
    parameters:
      - $ref: '#/components/parameters/assetId'
      - $ref: '#/components/parameters/versionTag'
    get:
      tags: [Knowledge Asset Repository]
      summary: Retrieve the raw content of the best Knowledge Carrier for a given version of a Knowledge Asset.
      description: >
        Same selection logic as `getKnowledgeAssetVersionCanonicalCarrier`,
        but returns the raw content of the chosen Artifact directly.
      operationId: getKnowledgeAssetVersionCanonicalCarrierContent
      parameters:
        - $ref: '#/components/parameters/extAccept'
      responses:
        '200':
          description: Success
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '300':
          description: Negotiation failed, but suitable alternatives are present.
          content:
            application/octet-stream:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Pointer'
        '303':
          description: Redirects the client to a URL where the chosen Artifact can be retrieved.
          headers:
            Location:
              schema:
                type: string
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '500':
          $ref: '#/components/responses/InternalError'
        '501':
          $ref: '#/components/responses/NotImplemented'

  #############################
  # Carriers
  #############################
  /cat/assets/{assetId}/versions/{versionTag}/carriers:
    parameters:
      - $ref: '#/components/parameters/assetId'
      - $ref: '#/components/parameters/versionTag'
    get:
      tags: [Knowledge Asset Repository]
      summary: Lists the known Carriers for a given Knowledge Asset.
      description: >
        Retrieves Pointers to all the (LATEST version of each) Knowledge
        Carriers of the given (version of) Knowledge Asset. The list may be
        empty if no Artifact is known, or if the user does not have access to
        a given Artifact. The list should be transparent with respect to
        Artifacts physically stored, linked or generated dynamically at
        runtime.
      operationId: listKnowledgeAssetCarriers
      parameters:
        - $ref: '#/components/parameters/offset'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/beforeTag'
        - $ref: '#/components/parameters/afterTag'
        - $ref: '#/components/parameters/sort'
      responses:
        '200':
          description: Success
          headers:
            X-Total-Count:
              $ref: '#/components/headers/X-Total-Count'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Pointer'
            application/xml:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Pointer'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '501':
          $ref: '#/components/responses/NotImplemented'
    post:
      tags: [Knowledge Asset Repository]
      summary: Registers a new Carrier for a given Knowledge Asset.
      description: >
        Registers a new Carrier for a given Knowledge Asset. The
        client-provided Carrier MUST match the Asset ID and version; the
        server SHALL use the Artifact ID and version provided by the client,
        which MUST not exist (the client should use
        setKnowledgeAssetCarrierVersion instead). The server MUST register
        the new Carrier in the Knowledge Graph, and update the Canonical
        Surrogate for the given Asset, incrementing its version. The server
        COULD validate the new Carrier against the client-provided
        representation metadata.
      operationId: addKnowledgeAssetCarrier
      requestBody:
        $ref: '#/components/requestBodies/assetCarrier'
      responses:
        '201':
          description: Success
          headers:
            Content-Location:
              description: URL where the new version of the Knowledge Asset Carrier is accessible
              schema:
                type: string
                format: uri
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/ReadOnly'
        '406':
          description: The provided Carrier (Artifact) cannot be inspected properly.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Artifact already exists with a different ID.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          $ref: '#/components/responses/InternalError'
        '501':
          $ref: '#/components/responses/NotImplemented'

  /cat/assets/{assetId}/versions/{versionTag}/carriers/{artifactId}:
    parameters:
      - $ref: '#/components/parameters/assetId'
      - $ref: '#/components/parameters/versionTag'
      - $ref: '#/components/parameters/artifactId'
    get:
      tags: [Knowledge Asset Repository]
      summary: Retrieves a specific Carrier for a given Knowledge Asset.
      description: >
        Retrieves (a copy of) the LATEST version of the given Carrier of a
        given Asset. Content Negotiation can be used to drive
        trans-representations of the specific Artifact, e.g. to ensure that
        the Artifact is transcribed between JSON and XML before being
        wrapped in the KnowledgeCarrier to be returned.
      operationId: getKnowledgeAssetCarrier
      parameters:
        - $ref: '#/components/parameters/extAccept'
      responses:
        '200':
          description: The identifiers can be resolved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeCarrier'
            application/xml:
              schema:
                $ref: '#/components/schemas/KnowledgeCarrier'
            text/html:
              schema:
                $ref: '#/components/schemas/KnowledgeCarrier'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /cat/assets/{assetId}/versions/{versionTag}/carriers/{artifactId}/versions:
    parameters:
      - $ref: '#/components/parameters/assetId'
      - $ref: '#/components/parameters/versionTag'
      - $ref: '#/components/parameters/artifactId'
    get:
      tags: [Knowledge Asset Repository]
      summary: Lists the version history of the Knowledge Asset Carrier.
      description: >
        Returns Pointers to all the Versions of a Knowledge Asset Carrier, if
        any.
      operationId: listKnowledgeAssetCarrierVersions
      parameters:
        - $ref: '#/components/parameters/offset'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/beforeTag'
        - $ref: '#/components/parameters/afterTag'
        - $ref: '#/components/parameters/sort'
      responses:
        '200':
          description: Success
          headers:
            X-Total-Count:
              $ref: '#/components/headers/X-Total-Count'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Pointer'
            application/xml:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Pointer'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '501':
          $ref: '#/components/responses/NotImplemented'

  /cat/assets/{assetId}/versions/{versionTag}/carriers/{artifactId}/versions/{artifactVersionTag}/content:
    parameters:
      - $ref: '#/components/parameters/assetId'
      - $ref: '#/components/parameters/versionTag'
      - $ref: '#/components/parameters/artifactId'
      - $ref: '#/components/parameters/artifactVersionTag'
    get:
      tags: [Knowledge Asset Repository]
      summary: Retrieves the raw content of a specific version of a Knowledge Asset Carrier.
      operationId: getKnowledgeAssetCarrierVersion
      parameters:
        - $ref: '#/components/parameters/extAccept'
      responses:
        '200':
          description: Success
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The provided Artifact is inconsistent with the current Asset metadata.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          $ref: '#/components/responses/InternalError'
        '501':
          $ref: '#/components/responses/NotImplemented'
    put:
      tags: [Knowledge Asset Repository]
      summary: Registers a (version of a) Carrier for a given Knowledge Asset.
      description: >
        Registers a Knowledge Artifact as the Carrier of a Knowledge Asset,
        based on the raw content of the Artifact. The Canonical Asset
        Surrogate SHOULD have been populated with metadata about the
        Artifact, but the server COULD either validate or try to infer more
        metadata for the specific Artifact version. If (and only if) the
        Surrogate is updated in the process, its version MUST be incremented.
      operationId: setKnowledgeAssetCarrierVersion
      requestBody:
        $ref: '#/components/requestBodies/exemplar'
      responses:
        '204':
          description: The Artifact has been uploaded correctly, and associated to the Knowledge Asset.
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The provided Artifact is inconsistent with the current Asset metadata.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          $ref: '#/components/responses/InternalError'
        '501':
          $ref: '#/components/responses/NotImplemented'

  #############################
  # Surrogates
  #############################
  /cat/assets/{assetId}/surrogate:
    parameters:
      - $ref: '#/components/parameters/assetId'
    get:
      tags: [Knowledge Asset Repository]
      summary: Retrieve the Canonical Knowledge Asset Surrogate for the latest version of an Asset, as a Knowledge Artifact.
      description: >
        Returns the LATEST version of the Canonical Surrogate of the LATEST
        referenced Asset, wrapped in a Knowledge Carrier, so that it can be
        consumed as a Knowledge Artifact. Supports content negotiation,
        allowing to retrieve this Surrogate in variant forms, if supported.
        If content negotiation is not used, the Surrogate in the response
        Knowledge Carrier is identical to the Surrogate returned by
        getKnowledgeAssetVersion for the same Asset ID and version.
      operationId: getKnowledgeAssetCanonicalSurrogate
      parameters:
        - $ref: '#/components/parameters/extAccept'
      responses:
        '200':
          description: A suitable representation of the Knowledge Surrogate could be retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeCarrier'
            application/xml:
              schema:
                $ref: '#/components/schemas/KnowledgeCarrier'
            text/html:
              schema:
                $ref: '#/components/schemas/KnowledgeCarrier'
        '300':
          description: Negotiation failed, but suitable alternatives are present.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Pointer'
            application/xml:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Pointer'
            text/html:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Pointer'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '500':
          $ref: '#/components/responses/InternalError'
        '501':
          $ref: '#/components/responses/NotImplemented'

  /cat/assets/{assetId}/versions/{versionTag}/surrogate:
    parameters:
      - $ref: '#/components/parameters/assetId'
      - $ref: '#/components/parameters/versionTag'
    get:
      tags: [Knowledge Asset Repository]
      summary: Retrieve the Canonical Knowledge Asset Surrogate, as a Knowledge Artifact.
      description: >
        Returns the LATEST version of the Canonical Surrogate of the
        referenced Asset (version), wrapped in a Knowledge Carrier, so that
        it can be consumed as a Knowledge Artifact. Supports content
        negotiation, allowing to retrieve this Surrogate in variant forms, if
        supported.
      operationId: getKnowledgeAssetVersionCanonicalSurrogate
      parameters:
        - $ref: '#/components/parameters/extAccept'
      responses:
        '200':
          description: A suitable representation of the Knowledge Surrogate could be retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeCarrier'
            application/xml:
              schema:
                $ref: '#/components/schemas/KnowledgeCarrier'
            text/html:
              schema:
                $ref: '#/components/schemas/KnowledgeCarrier'
        '300':
          description: Negotiation failed, but suitable alternatives are present.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Pointer'
            application/xml:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Pointer'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '500':
          $ref: '#/components/responses/InternalError'
        '501':
          $ref: '#/components/responses/NotImplemented'
    post:
      tags: [Knowledge Asset Repository]
      summary: Registers the Canonical Knowledge Asset Surrogate for a given Knowledge Asset.
      description: >
        Registers (or replaces) the Canonical Surrogate for a given Knowledge
        Asset version, provided as a Knowledge Carrier. Composite Assets are
        treated like other Assets. The components, and relationships
        thereof, will be persisted; however, the Composite itself, and the
        'hasPart' relationship, will not.
      operationId: addCanonicalKnowledgeAssetSurrogate
      requestBody:
        $ref: '#/components/requestBodies/surrogateCarrier'
      responses:
        '201':
          description: Success
        '403':
          $ref: '#/components/responses/Forbidden'
        '405':
          $ref: '#/components/responses/ReadOnly'
        '406':
          description: The server cannot translate the Carrier into a canonical Surrogate.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: The identifiers on the Carrier and the provided Surrogate do not match this asset.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          $ref: '#/components/responses/InternalError'
        '501':
          $ref: '#/components/responses/NotImplemented'

  /cat/assets/{assetId}/versions/{versionTag}/surrogates:
    parameters:
      - $ref: '#/components/parameters/assetId'
      - $ref: '#/components/parameters/versionTag'
    get:
      tags: [Knowledge Asset Repository]
      summary: Lists the known Surrogates for a given Knowledge Asset.
      description: >
        Retrieves Pointers to the various Surrogates for the given Asset
        version. The response MUST include the Canonical Knowledge Asset
        Surrogate, as returned by getKnowledgeAssetCanonicalSurrogate.
      operationId: listKnowledgeAssetSurrogates
      parameters:
        - $ref: '#/components/parameters/offset'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/beforeTag'
        - $ref: '#/components/parameters/afterTag'
        - $ref: '#/components/parameters/sort'
      responses:
        '200':
          description: Success
          headers:
            X-Total-Count:
              $ref: '#/components/headers/X-Total-Count'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Pointer'
            application/xml:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Pointer'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '501':
          $ref: '#/components/responses/NotImplemented'
    post:
      tags: [Knowledge Asset Repository]
      summary: Registers a new Surrogate for a given Knowledge Asset.
      description: >
        Registers a new, alternative (non-canonical) Surrogate for a given
        Knowledge Asset. The client-provided Carrier MUST match the Asset ID
        and version; the server SHALL use the Artifact ID and version
        provided by the client as a Surrogate Id, which MUST not exist, or a
        Conflict will be raised. In particular, this operation MUST not try
        to update the Canonical Surrogate, and will reject an alternative
        Surrogate that uses the canonical surrogate metamodel (clients should
        use setKnowledgeAssetVersion instead). The server MUST register the
        new Surrogate in the Knowledge Graph, and update the Canonical
        Surrogate for the given Asset, incrementing its version.
      operationId: addKnowledgeAssetSurrogate
      requestBody:
        $ref: '#/components/requestBodies/surrogateCarrier'
      responses:
        '201':
          description: Success
          headers:
            Content-Location:
              description: URL where the new version of the Knowledge Asset Surrogate is accessible
              schema:
                type: string
                format: uri
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/ReadOnly'
        '406':
          description: The provided Carrier (Surrogate) cannot be inspected properly.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: A different Surrogate with the same ID and version already exists.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          $ref: '#/components/responses/InternalError'
        '501':
          $ref: '#/components/responses/NotImplemented'

  /cat/assets/{assetId}/versions/{versionTag}/surrogates/{surrogateId}/versions:
    parameters:
      - $ref: '#/components/parameters/assetId'
      - $ref: '#/components/parameters/versionTag'
      - $ref: '#/components/parameters/surrogateId'
    get:
      tags: [Knowledge Asset Repository]
      summary: Lists the version history of the Knowledge Asset Surrogate.
      description: >
        Returns Pointers to all the Versions of a given Knowledge Asset
        Surrogate, for a given Asset.
      operationId: listKnowledgeAssetSurrogateVersions
      parameters:
        - $ref: '#/components/parameters/offset'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/beforeTag'
        - $ref: '#/components/parameters/afterTag'
        - $ref: '#/components/parameters/sort'
      responses:
        '200':
          description: Success
          headers:
            X-Total-Count:
              $ref: '#/components/headers/X-Total-Count'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Pointer'
            application/xml:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Pointer'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '501':
          $ref: '#/components/responses/NotImplemented'

  #############################
  # Composites
  #############################
  /cat/assets/{assetId}/versions/{versionTag}/composite/structure:
    parameters:
      - $ref: '#/components/parameters/assetId'
      - $ref: '#/components/parameters/versionTag'
    get:
      tags: [Knowledge Asset Repository]
      summary: Retrieves the Structure of a Composite Knowledge Asset.
      description: >
        Given a Composite Knowledge Asset, retrieves the Struct(ure)
        component, a graph-oriented Artifact that establishes types, roles
        and relationships between the Composite's parts. The Structure MUST
        contain 'has-part' relationships to other Assets, and SHOULD also
        contain 'depends-on' relationships, referencing specific versions of
        Knowledge Assets. The Graph itself is a Knowledge Artifact (e.g.
        expressed using some form of RDF) and, as such, is negotiable. If
        invoked on an atomic Knowledge Asset, returns a singleton Graph with
        one node corresponding to the Atomic Asset itself.
      operationId: getCompositeKnowledgeAssetStructure
      parameters:
        - $ref: '#/components/parameters/extAccept'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeCarrier'
            application/xml:
              schema:
                $ref: '#/components/schemas/KnowledgeCarrier'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '501':
          $ref: '#/components/responses/NotImplemented'
    post:
      tags: [Knowledge Asset Repository]
      summary: Initializes a new Composite Knowledge Asset Structure (Anonymous).
      description: >
        Given an existing Knowledge Asset, executes a query that selects one
        or more Assets based on the transitive closure of a (dependency)
        relationship. The query's result triples are returned as the
        implicit structure of a (tree-based) Anonymous Composite Knowledge
        Asset Surrogate.
      operationId: getAnonymousCompositeKnowledgeAssetStructure
      parameters:
        - $ref: '#/components/parameters/extAccept'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeCarrier'
            application/xml:
              schema:
                $ref: '#/components/schemas/KnowledgeCarrier'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '501':
          $ref: '#/components/responses/NotImplemented'

  /cat/assets/{assetId}/versions/{versionTag}/composite/surrogate:
    parameters:
      - $ref: '#/components/parameters/assetId'
      - $ref: '#/components/parameters/versionTag'
    get:
      tags: [Knowledge Asset Repository]
      summary: Assembles a Composite Knowledge Asset Surrogate using the Surrogates of the components.
      description: >
        Given a Composite Knowledge Asset, the server SHALL consult the
        Structure to determine its Components, retrieve the Surrogate for
        each Component, and assemble them into a Composite Knowledge
        Carrier. The Surrogate SHOULD be the Canonical surrogate, unless
        Content Negotiation is used and better alternatives can fit the
        client's request. Content Negotiation can also be used to apply some
        trans-formation to the Canonical Surrogates before returning them
        (e.g. projection by profile, or transcription between JSON vs XML).
        The server MIGHT also support the flattening of the Surrogates into
        a single Surrogate, if such an operation is defined for the
        retrieved Surrogates.
      operationId: getCompositeKnowledgeAssetSurrogate
      parameters:
        - $ref: '#/components/parameters/flat'
        - $ref: '#/components/parameters/extAccept'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeCarrier'
            application/xml:
              schema:
                $ref: '#/components/schemas/KnowledgeCarrier'
        '300':
          description: The Composite Asset cannot be assembled in the desired format, but alternatives are available.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Pointer'
            application/xml:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Pointer'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '406':
          description: The Artifact(s) cannot be delivered using the desired representation(s), and no alternatives are available.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          $ref: '#/components/responses/InternalError'
        '501':
          $ref: '#/components/responses/NotImplemented'
    post:
      tags: [Knowledge Asset Repository]
      summary: Assembles an Anonymous Composite Knowledge Asset Surrogate using an Asset and its relationships as a seed.
      description: >
        Given an existing Knowledge Asset, executes a query that selects one
        or more Assets based on the transitive closure of a (dependency)
        relationship. The query's result bindings are treated as Asset Ids,
        resolved, and used to construct an Anonymous Composite Knowledge
        Asset Surrogate.
      operationId: getAnonymousCompositeKnowledgeAssetSurrogate
      parameters:
        - $ref: '#/components/parameters/extAccept'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeCarrier'
            application/xml:
              schema:
                $ref: '#/components/schemas/KnowledgeCarrier'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '501':
          $ref: '#/components/responses/NotImplemented'

components:
  headers:
    X-Total-Count:
      description: >
        The total number of elements in the (filtered) collection, before
        `offset`/`limit` pagination is applied. Allows clients to implement
        pagination without changing the shape of the response body.
      schema:
        type: integer

  parameters:
    assetTypeTag:
      name: assetTypeTag
      in: query
      description: >
        An unqualified, codified term ("tag") that identifies a type,
        category or class of Knowledge Assets defined in some ontology or
        classification scheme known to the server.
      schema:
        type: string
    assetAnnotationTag:
      name: assetAnnotationTag
      in: query
      description: >
        An unqualified, codified term ("tag") that identifies a relationship
        between a Knowledge Asset and a concept. The relationship must be
        defined in some ontology known to the server.
      schema:
        type: string
    assetAnnotationConcept:
      name: assetAnnotationConcept
      in: query
      description: A fully qualified (URI) term that denotes a concept that can be used to annotate assets.
      schema:
        type: string
        format: uri
    assetId:
      name: assetId
      in: path
      description: The id of the Knowledge Asset (Series).
      required: true
      schema:
        type: string
        format: uuid
    versionTag:
      name: versionTag
      in: path
      description: >
        The version tag of a Versioned Entity. Versioned Identifiers identify
        specific, Immutable Versions of Mutable Entities, which reflect the
        state of that Entity at a given point in time. Where a version(ed)
        identifier is universal, the Tag represents the local part of that
        identifier, under the scope of the identifier that denotes the
        Entity (series).
      required: true
      schema:
        type: string
    artifactId:
      name: artifactId
      in: path
      description: The id of the Knowledge Artifact that carries a concrete expression of a Knowledge Asset.
      required: true
      schema:
        type: string
        format: uuid
    surrogateId:
      name: surrogateId
      in: path
      description: The id of the Knowledge Artifact that carries a metadata record about a Knowledge Asset.
      required: true
      schema:
        type: string
        format: uuid
    artifactVersionTag:
      name: artifactVersionTag
      in: path
      description: The version tag of a (version of a) Knowledge Artifact.
      required: true
      schema:
        type: string
    surrogateVersionTag:
      name: surrogateVersionTag
      in: path
      description: The version tag of a (version of a) Knowledge Asset Surrogate.
      required: true
      schema:
        type: string
    depth:
      name: depth
      in: query
      description: >
        The maximum allowed relationship-induced distance between two
        assets. Two assets X and Y have distance N if there exist other N-1
        distinct assets W such that X is related to W1, W1 is related to W2,
        .., Wn-1 is related to Y.
      schema:
        type: integer
    flat:
      name: flat
      in: query
      description: >
        Determines whether a Composite Asset should be flattened into a
        single Asset, or its Component Assets should be maintained separate.
      schema:
        type: boolean
    extAccept:
      name: X-Accept
      in: header
      description: >
        A MIME Type that codifies the syntactic representation of a
        Knowledge Artifact, as accepted by the client in a content
        negotiation sense. This is the Knowledge Asset Repository's own,
        Artifact-level content negotiation mechanism, distinct from the
        standard HTTP `Accept` header, which OpenAPI applies natively to
        select amongst the `content` media types declared on each response.
      schema:
        type: string
    beforeTag:
      name: beforeTag
      in: query
      description: >
        Restricts the series to include only versions before (included) a
        given version Tag. Assumes the underlying versioning scheme has at
        least a partial ordering defined.
      schema:
        type: string
    afterTag:
      name: afterTag
      in: query
      description: >
        Restricts the series to include only versions after (included) a
        given version Tag. Assumes the underlying versioning scheme has at
        least a partial ordering defined.
      schema:
        type: string
    sort:
      name: sort
      in: query
      description: Allows to sort a collection by one or more properties.
      schema:
        type: string
        default: asc
    offset:
      name: offset
      in: query
      description: >
        Filters elements in a collection, returning all elements after the
        'offset' index included, ignoring all previous elements.
      schema:
        type: integer
    limit:
      name: limit
      in: query
      description: Returns up to the given number of elements in a collection.
      schema:
        type: integer

  requestBodies:
    assetSurrogate:
      description: The Surrogate of a Knowledge Asset.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/KnowledgeAsset'
        application/xml:
          schema:
            $ref: '#/components/schemas/KnowledgeAsset'
      required: false
    surrogateCarrier:
      description: The Surrogate of a Knowledge Asset, wrapped in a Knowledge Carrier.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/KnowledgeCarrier'
        application/xml:
          schema:
            $ref: '#/components/schemas/KnowledgeCarrier'
      required: true
    assetCarrier:
      description: The manifestation of a Knowledge Asset, wrapped as a Knowledge Carrier.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/KnowledgeCarrier'
        application/xml:
          schema:
            $ref: '#/components/schemas/KnowledgeCarrier'
      required: true
    exemplar:
      description: A Knowledge Artifact that carries an exemplar of a Knowledge Asset.
      content:
        application/octet-stream:
          schema:
            type: string
            format: binary
      required: false
    graphQuery:
      description: >
        The query, wrapped in a KnowledgeCarrier that must state in what
        language the query is expressed.
      content:
        '*/*':
          schema:
            $ref: '#/components/schemas/KnowledgeCarrier'
      required: true

  responses:
    BadRequest:
      description: The query or request contains errors.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Forbidden:
      description: The client does not have the necessary permissions.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    NotFound:
      description: The Asset, Asset Version or Artifact was not found.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    ReadOnly:
      description: Not supported - the repository is read-only.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    NotAcceptable:
      description: No suitable variant/representation is available.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    InternalError:
      description: Internal error.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    NotImplemented:
      description: >
        Not implemented. This operation is OPTIONAL for a conformant server
        to support.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

  schemas:
    ProblemDetails:
      type: object
      description: >
        A uniform, RFC 9457 ("Problem Details for HTTP APIs") style error
        representation, used consistently across this API instead of the
        empty error bodies of the original specification.
      properties:
        type:
          type: string
          format: uri
          description: A URI reference that identifies the problem type.
        title:
          type: string
          description: A short, human-readable summary of the problem type.
        status:
          type: integer
          description: The HTTP status code generated by the origin server.
        detail:
          type: string
          description: A human-readable explanation specific to this occurrence of the problem.
        instance:
          type: string
          format: uri
          description: A URI reference that identifies the specific occurrence of the problem.

    Pointer:
      type: object
      description: >
        A lightweight reference to a Knowledge Asset, Artifact, or Surrogate,
        used in collection responses to avoid returning full Resources.

    KnowledgeCarrier:
      type: object
      description: >
        A Resource that wraps a Serialized, Encoded Knowledge Artifact,
        possibly Composite.

    KnowledgeAsset:
      title: Knowledge Asset Surrogate
      type: object
      description: >
        A Resource that contains descriptive information about a specific
        version of a Knowledge Asset, as well as its known Representations
        and/or Manifestations. The actual content model is implementation
        specific, so the adopted language specification must be manifested
        by the Knowledge Asset Catalog.

    KnowledgeAssetCatalog:
      title: Knowledge Asset Catalog
      type: object
      description: >
        A Resource that provides a summary of the features of a Catalog at a
        given point in time, including the categories and types of Assets it
        supports, and the model/schema used to represent Assets' descriptions.

    QueryResults:
      title: QueryResults
      type: object
      description: A key/value pair map that binds the variables of a query to the result answer.
