components:
  parameters:
    id:
      name: id
      in: path
      required: true
      description: URI (TPigId) of the item, e.g. `ns:123e4567-e89b-12d3-a456-426614174000` or a URL.
      schema:
        $ref: '#/components/schemas/TPigId'
    limit:
      name: limit
      in: query
      required: false
      description: >
        Maximum number of items to return in a single page of results.
        Used together with `offset` for pagination; defaults to 100 if omitted.
      schema:
        type: integer
        minimum: 1
        default: 100
    offset:
      name: offset
      in: query
      required: false
      description: >
        Number of items to skip from the beginning of the (filtered) result set
        before starting to return results. Used together with `limit` for
        pagination; defaults to 0 (start at the first item) if omitted.
      schema:
        type: integer
        minimum: 0
        default: 0
    specializes:
      name: specializes
      in: query
      required: false
      description: >
        Filter items that specialize (are subclasses of) the given class URI,
        i.e. whose own `specializes` attribute equals this value. Only
        applicable to metamodel classes (Enumeration, Property, Link, Entity,
        Relationship), which may form a `rdfs:subClassOf` hierarchy via
        `specializes`.
      schema:
        $ref: '#/components/schemas/TPigId'
    instanceOf:
      name: instanceOf
      in: query
      required: false
      description: Filter instances of the given class URI.
      schema:
        $ref: '#/components/schemas/TPigId'
    format:
      name: format
      in: query
      required: false
      description: >
        Desired serialization format of the returned representation(s).
        `cas.jsonld` (default) returns CASCaRA JSON-LD, the native format used
        throughout this API and in the request bodies of write operations.
        `cas.xml` returns the equivalent CASCaRA XML representation.
        `cas.ttl` returns the equivalent representation as RDF Turtle.
      schema:
        type: string
        enum: [cas.jsonld, cas.xml, cas.ttl]
        default: cas.jsonld

  responses:
    BadRequest:
      description: The request payload failed schema or constraint validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: No item with the given id was found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: The operation conflicts with the current state (e.g. duplicate id, or item still referenced).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    EnumerationCreated:
      description: Enumeration created or updated
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Enumeration'

  schemas:
    TPigId:
      type: string
      description: >
        An URI, typically a UUID with namespace (e.g. 'ns:123e4567-e89b-12d3-a456-426614174000') or a URL.
      example: 'ns:123e4567-e89b-12d3-a456-426614174000'

    TRevision:
      type: string
      description: Revision identifier of an item.

    TISODateString:
      type: string
      format: date-time
      description: ISO 8601 date-time string.

    LanguageText:
      type: object
      description: Multi-language text value.
      required: [text]
      properties:
        text:
          type: string
        lang:
          type: string
          description: BCP-47 language tag, optional when only a single language value is given.

    Text:
      type: object
      description: Single-language text value, e.g. used for icon/color.
      properties:
        text:
          type: string
        lang:
          type: string

    Error:
      type: object
      properties:
        status:
          type: integer
        statusText:
          type: string
        details:
          type: string

    # --- Base/abstract building blocks (not exposed standalone) ---
    Item:
      type: object
      required: [itemType, instanceOf]
      properties:
        itemType:
          type: string
          description: The CASCaRA item type URI, e.g. 'cas:Entity'.
        instanceOf:
          $ref: '#/components/schemas/TPigId'

    Identifiable:
      allOf:
        - $ref: '#/components/schemas/Item'
        - type: object
          required: [id]
          properties:
            id:
              $ref: '#/components/schemas/TPigId'
            specializes:
              $ref: '#/components/schemas/TPigId'
            title:
              type: array
              items:
                $ref: '#/components/schemas/LanguageText'
            description:
              type: array
              items:
                $ref: '#/components/schemas/LanguageText'
            definition:
              type: array
              items:
                $ref: '#/components/schemas/LanguageText'
            revision:
              $ref: '#/components/schemas/TRevision'
            priorRevision:
              type: array
              items:
                $ref: '#/components/schemas/TRevision'
            modified:
              $ref: '#/components/schemas/TISODateString'
            creator:
              type: string

    Element:
      allOf:
        - $ref: '#/components/schemas/Identifiable'
        - type: object
          properties:
            enumeratedProperty:
              type: array
              items:
                $ref: '#/components/schemas/TPigId'
              description: Allowed Property class URIs; undefined=all allowed, empty=none allowed.
            icon:
              $ref: '#/components/schemas/Text'
            color:
              $ref: '#/components/schemas/Text'

    AProperty:
      type: object
      description: Embedded property value, part of anEntity/aRelationship/aPackage; has no own id.
      allOf:
        - $ref: '#/components/schemas/Item'
        - type: object
          properties:
            value:
              type: string
            composes:
              type: array
              items:
                $ref: '#/components/schemas/TPigId'

    ALink:
      type: object
      description: Embedded link value, part of anEntity/aRelationship/aPackage; has no own id.
      allOf:
        - $ref: '#/components/schemas/Item'
        - type: object
          required: [idRef]
          properties:
            idRef:
              $ref: '#/components/schemas/TPigId'

    AnElement:
      allOf:
        - $ref: '#/components/schemas/Identifiable'
        - type: object
          properties:
            hasProperty:
              type: array
              items:
                $ref: '#/components/schemas/AProperty'
            hasTargetLink:
              type: array
              items:
                $ref: '#/components/schemas/ALink'
              maxItems: 1

    # --- Concrete metamodel classes ---
    EnumeratedValue:
      type: object
      required: [id]
      properties:
        id:
          $ref: '#/components/schemas/TPigId'
        title:
          type: array
          items:
            $ref: '#/components/schemas/LanguageText'
        value:
          type: string

    Enumeration:
      description: cas:Enumeration - a metamodel class defining a list of allowed values.
      allOf:
        - $ref: '#/components/schemas/Element'
        - type: object
          required: [datatype, enumeratedValue]
          properties:
            itemType:
              type: string
              enum: ['cas:Enumeration']
            datatype:
              type: string
              description: Must be one of XsDataType, e.g. 'xs:string'.
            enumeratedValue:
              type: array
              items:
                $ref: '#/components/schemas/EnumeratedValue'

    Property:
      description: cas:Property - a metamodel class defining a data property.
      allOf:
        - $ref: '#/components/schemas/Identifiable'
        - type: object
          required: [datatype]
          properties:
            itemType:
              type: string
              enum: ['cas:Property']
            datatype:
              type: string
              description: Must be one of XsDataType, e.g. 'xs:string'.
            readOnly:
              type: boolean
              default: false
            minCount:
              type: integer
            maxCount:
              type: integer
            maxLength:
              type: integer
              description: Only used for string datatype.
            pattern:
              type: string
              description: RegExp pattern, only used for string datatype.
            minInclusive:
              type: number
            maxInclusive:
              type: number
            defaultValue:
              type: string
            composes:
              type: array
              items:
                $ref: '#/components/schemas/TPigId'

    Link:
      description: cas:Link - a metamodel class defining a relationship endpoint type.
      allOf:
        - $ref: '#/components/schemas/Identifiable'
        - type: object
          required: [enumeratedEndpoint]
          properties:
            itemType:
              type: string
              enum: ['cas:Link']
            enumeratedEndpoint:
              type: array
              items:
                $ref: '#/components/schemas/TPigId'
              description: URIs of allowed Entity or Relationship classes.
            readOnly:
              type: boolean
              default: false
            revisionAware:
              type: boolean
              default: false
            minCount:
              type: integer
            maxCount:
              type: integer
            defaultValue:
              $ref: '#/components/schemas/TPigId'

    Entity:
      description: cas:Entity - a metamodel class.
      allOf:
        - $ref: '#/components/schemas/Element'
        - type: object
          properties:
            itemType:
              type: string
              enum: ['cas:Entity']
            enumeratedTargetLink:
              type: array
              items:
                $ref: '#/components/schemas/TPigId'
              description: Allowed Link class URIs; undefined=all allowed, empty=none allowed.

    Relationship:
      description: cas:Relationship - a metamodel class.
      allOf:
        - $ref: '#/components/schemas/Element'
        - type: object
          properties:
            itemType:
              type: string
              enum: ['cas:Relationship']
            enumeratedSourceLink:
              type: array
              items:
                $ref: '#/components/schemas/TPigId'
              description: Allowed source Link class URI (exactly one).
            enumeratedTargetLink:
              type: array
              items:
                $ref: '#/components/schemas/TPigId'
              description: Allowed target Link class URI (exactly one).

    # --- Concrete metamodel instances ---
    AnEntity:
      description: cas:anEntity - an instance of an Entity class.
      allOf:
        - $ref: '#/components/schemas/AnElement'
        - type: object
          required: [instanceOf]
          properties:
            itemType:
              type: string
              enum: ['cas:anEntity']

    ARelationship:
      description: cas:aRelationship - an instance of a Relationship class.
      allOf:
        - $ref: '#/components/schemas/AnElement'
        - type: object
          required: [instanceOf, hasSourceLink]
          properties:
            itemType:
              type: string
              enum: ['cas:aRelationship']
            hasSourceLink:
              type: array
              items:
                $ref: '#/components/schemas/ALink'
              minItems: 1
              maxItems: 1

    Namespace:
      type: object
      properties:
        prefix:
          type: string
        uri:
          type: string

    APackage:
      description: cas:aPackage - a container instance holding an embedded graph of items.
      allOf:
        - $ref: '#/components/schemas/AnElement'
        - type: object
          required: [instanceOf, graph]
          properties:
            itemType:
              type: string
              enum: ['cas:aPackage']
            context:
              oneOf:
                - type: array
                  items:
                    $ref: '#/components/schemas/Namespace'
                - type: string
                - type: object
                  additionalProperties:
                    type: string
            graph:
              type: array
              description: Embedded graph of CASCaRA items (any concrete metamodel class or instance).
              items:
                type: object

    APackageProxy:
      description: Minimal stand-in representation of an aPackage, without its graph.
      type: object
      required: [id, itemType]
      properties:
        id:
          $ref: '#/components/schemas/TPigId'
        itemType:
          type: string
          enum: ['cas:aPackage']
        modified:
          $ref: '#/components/schemas/TISODateString'
        revision:
          $ref: '#/components/schemas/TRevision'
        creator:
          type: string
