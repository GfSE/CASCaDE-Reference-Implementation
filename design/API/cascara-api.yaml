openapi: 3.0.3
info:
  title: CASCaRA API
  description: >
    REST API providing CRUD (Create, Read, Update, Delete) operations for every
    concrete metamodel item type of the CASCaRA Graph, namespace prefix `cas:`.
    Concrete metamodel classes (schema-level, itemType ends without a leading
    lower-case article): Enumeration, Property, Link, Entity, Relationship.
    Concrete metamodel instances (individuals, itemType starts with a
    lower-case article): anEntity, aRelationship, aPackage.
    `aProperty`, `aSourceLink` and `aTargetLink` are not exposed as standalone
    resources because they have no identifier of their own and only exist as
    embedded parts of anEntity, aRelationship or aPackage.
  version: 1.0.0
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0
  contact:
    name: GfSE
    url: https://gfse.org

servers:
  - url: /api/v1
    description: CASCaRA API base path

tags:
  - name: Enumeration
    description: CRUD for cas:Enumeration (metamodel class)
  - name: Property
    description: CRUD for cas:Property (metamodel class)
  - name: Link
    description: CRUD for cas:Link (metamodel class)
  - name: Entity
    description: CRUD for cas:Entity (metamodel class)
  - name: Relationship
    description: CRUD for cas:Relationship (metamodel class)
  - name: anEntity
    description: CRUD for cas:anEntity (instance)
  - name: aRelationship
    description: CRUD for cas:aRelationship (instance)
  - name: aPackage
    description: CRUD for cas:aPackage (instance / container)

paths:
  #############################
  # Enumeration
  #############################
  /enumerations:
    get:
      tags: [Enumeration]
      summary: List Enumerations
      operationId: listEnumerations
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
        - $ref: '#/components/parameters/specializes'
        - $ref: '#/components/parameters/format'
      responses:
        '200':
          description: Array of Enumeration items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Enumeration'
        '400':
          $ref: '#/components/responses/BadRequest'
    post:
      tags: [Enumeration]
      summary: Create a new Enumeration
      operationId: createEnumeration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Enumeration'
      responses:
        '201':
          $ref: '#/components/responses/EnumerationCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
  /enumerations/{id}:
    parameters:
      - $ref: '#/components/parameters/id'
    get:
      tags: [Enumeration]
      summary: Get an Enumeration by id
      operationId: getEnumeration
      parameters:
        - $ref: '#/components/parameters/format'
      responses:
        '200':
          description: The requested Enumeration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Enumeration'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Enumeration]
      summary: Replace/update an Enumeration
      operationId: updateEnumeration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Enumeration'
      responses:
        '200':
          $ref: '#/components/responses/EnumerationCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
